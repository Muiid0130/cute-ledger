<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小狗記帳">
<meta name="theme-color" content="#FFFDF6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>小狗記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Gaegu:wght@400;700&display=swap">
<style>
@font-face{font-family:"Jinxuan7";font-weight:400 900;src:local("jf金萱 4.0 七分糖"),local("jf-jinxuan-4.0-Bold"),local("jf-jinxuan-4.0 Bold"),local("jf金萱3.0 七分糖"),local("jf-jinxuan-3.0 Medium"),local("jf-jinxuan-fresh2.2 Medium")}
:root{
  color-scheme: light;
  --paper:#FFFDF6; --grid:#DCEAF5; --ink:#3A3550; --ink-soft:#7B7592;
  --a1:#8FD6BC; --a1-soft:#DDF5EC; --a2:#FFD66E; --a2-soft:#FFF2C9; --a3:#8EC3F0; --tape:#FF9FB8;
  --card:#fff; --up:#E4574F; --down:#3A9F66; --danger:#E0605E;
  --wob:255px 18px 225px 16px / 16px 225px 18px 255px;
  --wob2:18px 225px 16px 255px / 255px 16px 225px 18px;
  --hand:"Jinxuan7","jf金萱 4.0","Huninn","jf open 粉圓 2.0","PingFang TC",sans-serif;
  --num:"Gaegu","Huninn","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.btn{white-space:nowrap}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:16px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;background-attachment:fixed;-webkit-tap-highlight-color:transparent}
button,.key,.chip{touch-action:manipulation}
button{font-family:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0}
input,select{font-family:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px dashed var(--a3);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:700}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;flex:none;overflow:visible}
.wrap{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 130px;display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob);box-shadow:3px 4px 0 var(--ink);padding:14px}
.sheet.alt{border-radius:var(--wob2)}
.label{font-size:13px;color:var(--ink-soft);letter-spacing:.05em}
.muted{color:var(--ink-soft)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grow{flex:1;min-width:0}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px}
.mascot{display:block;object-fit:cover;border:2px solid var(--ink);border-radius:24%}
.brand .mascot{width:46px;height:46px}
.brand h1{margin:0;font-size:22px;line-height:1.1}
.brand small{display:block;font-size:12px;color:var(--ink-soft)}
.chipbtn{display:inline-flex;align-items:center;gap:4px;font-size:14px;background:var(--a2-soft);border:2px solid var(--ink);border-radius:var(--wob2);padding:3px 10px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pagehead h2{margin:0;font-size:24px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border:2px solid var(--ink);border-radius:50% 45% 55% 48%;background:var(--card);display:grid;place-items:center}
.stepper .ic{width:16px;height:16px}
.stepper span{font-family:var(--num);font-weight:700;font-size:20px;min-width:64px;text-align:center}

.sample{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--a2-soft);border:2px dashed var(--ink);border-radius:14px;padding:7px 12px;font-size:14px}
.sample button{background:var(--card);border:2px solid var(--ink);border-radius:var(--wob2);padding:3px 10px;font-size:13px;white-space:nowrap}

/* section titles */
.st{display:flex;align-items:baseline;justify-content:space-between;margin:4px 4px -4px}
.st h3{margin:0;font-size:18px;position:relative;display:inline-block;z-index:0}
.st h3::after{content:"";position:absolute;left:-3px;right:-5px;bottom:1px;height:9px;background:var(--a2);opacity:.75;z-index:-1;border-radius:4px;transform:rotate(-1deg)}
.st .hint{font-size:13px;color:var(--ink-soft)}
.link{font-size:14px;text-decoration:underline wavy var(--a1);text-underline-offset:4px}

/* hero */
.hero{position:relative;background:var(--a1-soft);text-align:center;padding:18px 14px 14px}
.hero .tape{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-3deg);width:84px;height:20px;background:var(--tape);border-radius:3px;opacity:.85}
.hero .big{font-size:60px;line-height:1;margin:6px 0 2px}
.hero .big small{font-size:22px;margin-right:4px;color:var(--ink-soft)}
.hero .sub{font-size:14px;color:var(--ink-soft)}
.hero .mascot{position:absolute;right:8px;top:8px;width:50px;height:50px}
.pills{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;border:2px solid var(--ink);border-radius:999px;padding:2px 10px;background:var(--card)}
.pill.hot{background:var(--a2)}
.pill .ic{width:15px;height:15px}
.fall{margin-top:12px;text-align:left;background:var(--card);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.fall .fr{display:grid;grid-template-columns:6px 1fr auto;gap:8px;align-items:center;font-size:14px}
.fall .fr i{height:16px;border-radius:3px}
.fall .fr.total{border-top:2px solid var(--ink);padding-top:5px;margin-top:2px;font-size:16px}
.fall .warn{color:var(--danger);font-size:13px}

/* inbox banner */
.banner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:2.5px solid var(--ink);border-top:6px solid var(--a2);border-radius:var(--wob2);padding:10px 12px;box-shadow:3px 4px 0 var(--ink)}
.badge{min-width:24px;height:24px;border-radius:50%;background:var(--a2);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:15px}

/* bags */
.bags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bag{position:relative;text-align:left;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob);box-shadow:3px 3px 0 var(--ink);padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;transition:transform .1s}
.bag:nth-child(even){border-radius:var(--wob2)}
.bag:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.bag .top{display:flex;align-items:center;gap:8px}
.tile{width:34px;height:34px;flex:none;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50% 45% 55% 48%}
.tile .ic{width:21px;height:21px}
.bag .name{font-size:15px;line-height:1.15}
.bag .left{font-size:12px;color:var(--ink-soft)}
.bag .left .num{font-size:20px;color:var(--ink)}
.bag.over .left .num{color:var(--danger)}
.bar{height:11px;border:2px solid var(--ink);border-radius:8px 10px 7px 9px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;border-right:2px solid var(--ink);background-image:repeating-linear-gradient(-45deg,transparent 0 4px,rgba(255,255,255,.55) 4px 7px)}
.bar.thin{height:9px}

/* txns */
.txns{display:flex;flex-direction:column}
.day{font-size:13px;color:var(--ink-soft);padding:8px 0 2px;border-bottom:2px solid var(--grid)}
.txn{display:grid;grid-template-columns:34px 1fr auto 26px;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--grid)}
.txn:last-child{border-bottom:none}
.txn .t1{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txn .t2{font-size:12px;color:var(--ink-soft)}
.txn .amt{font-size:21px;text-align:right}
.txn .amt small{display:block;font-size:12px;color:var(--down);font-family:var(--hand);font-weight:400}
.txn .del{color:var(--ink-soft)}
.txn .del .ic{width:17px;height:17px}
.empty{color:var(--ink-soft);text-align:center;padding:10px;font-size:14px}

/* charts */
.chart-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none;margin:auto}
.legend{flex:1;min-width:170px;display:flex;flex-direction:column;gap:5px;margin:0;padding:0;list-style:none}
.legend li{display:grid;grid-template-columns:14px 1fr auto 38px;gap:8px;align-items:center;font-size:14px}
.dot{width:14px;height:14px;border:2px solid var(--ink);border-radius:50% 40% 55% 45%}
.legend .pct{font-size:13px;color:var(--ink-soft);text-align:right}
svg.plot{width:100%;height:auto;display:block}
.plan{display:flex;flex-direction:column;gap:9px}
.plan .pr{display:flex;flex-direction:column;gap:3px}
.plan .pr .between{font-size:14px}
.foot{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-top:6px}
.foot b{color:var(--ink);font-family:var(--num);font-size:16px}

/* cards page */
.finder{display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-soft)}
.inp{font-size:16px;border:2px solid var(--ink);border-radius:10px 12px 9px 11px;padding:8px 10px;background:var(--card);width:100%;min-width:0}
.inp.big{font-family:var(--num);font-weight:700;font-size:26px;padding:4px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);background:var(--card);border-radius:var(--wob2);padding:3px 10px;font-size:14px;white-space:nowrap}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--a2);box-shadow:2px 2px 0 var(--ink)}
.rank{display:flex;flex-direction:column;gap:8px}
.rk{border:2.5px solid var(--ink);border-radius:var(--wob);padding:10px 12px;background:var(--card);display:flex;flex-direction:column;gap:4px}
.rk.first{background:var(--a2-soft);box-shadow:3px 3px 0 var(--ink)}
.rk .rate{font-size:26px}
.rk details{font-size:13px;color:var(--ink-soft)}
.rk summary{cursor:pointer}
.no{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--num);font-weight:700;background:var(--card)}
.tag{display:inline-block;font-size:12px;border:1.5px solid var(--ink);border-radius:6px;padding:0 6px;background:var(--card);white-space:nowrap}
.tag.ok{background:var(--a1-soft)}
.tag.meh{background:var(--a2-soft)}
.cc{position:relative;display:flex;flex-direction:column;gap:8px}
.cc .face{border:2.5px solid var(--ink);border-radius:16px 20px 14px 18px;padding:12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(255,255,255,.25) 10px 12px)}
.cc .face .num{font-size:18px;letter-spacing:.1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2.5px solid var(--ink);background:var(--a1);border-radius:var(--wob);box-shadow:2px 3px 0 var(--ink);padding:8px 14px;font-size:16px}
.btn:active{transform:translate(1px,2px);box-shadow:none}
.btn.ghost{background:var(--card)}
.btn.soft{background:var(--a2-soft)}
.btn.warn{background:var(--a1-soft);color:var(--danger)}
.btn.sm{font-size:14px;padding:4px 10px;box-shadow:2px 2px 0 var(--ink)}
.btn .ic{width:18px;height:18px}
.btn:disabled{opacity:.45}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:14px}
code,.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--a2-soft);border:1.5px dashed var(--ink);border-radius:6px;padding:1px 5px;word-break:break-all}
pre.code{white-space:pre-wrap;padding:8px;margin:4px 0 0}

/* assets */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles .sheet{padding:10px 12px}
.tiles .v{font-size:28px;line-height:1.1}
.up{color:var(--up)} .down{color:var(--down)}
.hold{display:flex;flex-direction:column}
.hr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:2px dashed var(--grid);text-align:left;width:100%}
.hr:last-child{border-bottom:none}
.hr .n{font-size:16px}
.hr .d{font-size:12px;color:var(--ink-soft)}
.hr .v{font-size:20px;text-align:right}
.hr .chg{font-size:13px;text-align:right}
.stamp{display:inline-block;transform:rotate(-4deg);border:2px solid currentColor;border-radius:6px;padding:0 6px;font-size:12px}

/* goals */
.gbig{font-size:40px;line-height:1}
.gi{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--grid)}
.gi:last-child{border-bottom:none}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mo{border:2px solid var(--ink);border-radius:10px 12px 9px 11px;padding:4px 6px;text-align:left;background:var(--card);font-size:12px;color:var(--ink-soft)}
.mo .num{display:block;font-size:17px;color:var(--ink)}
.mo.now{background:var(--a2-soft)}
.mo.none{opacity:.45}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 10px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock nav{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:var(--card);border:2.5px solid var(--ink);border-radius:26px 30px 24px 28px / 24px 26px 30px 26px;box-shadow:3px 4px 0 var(--ink);padding:6px 4px 5px}
.dock nav>button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--ink-soft);padding:4px 0;position:relative}
.dock nav>button .ic{width:24px;height:24px}
.dock nav>button[aria-current="page"]{color:var(--ink)}
.dock nav>button[aria-current="page"]::before{content:"";position:absolute;top:1px;width:34px;height:28px;background:var(--a2);border-radius:50% 45% 55% 48%;z-index:-1}
.dock nav>button{z-index:0}
.dock .add{margin-top:-24px;align-self:center}
.dock .add span.circle{width:54px;height:54px;border-radius:50% 46% 52% 48%;background:var(--a1);border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink);display:grid;place-items:center;color:var(--ink)}
.dock .add .ic{width:28px;height:28px;stroke-width:2.8}
.dock .dbadge{position:absolute;top:0;right:calc(50% - 20px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-family:var(--num);font-weight:700;border:1.5px solid var(--ink)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(40,30,50,.35);z-index:10}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:480px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-bottom:none;border-radius:28px 30px 0 0 / 24px 26px 0 0;padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:10px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.drawer .grip{width:46px;height:5px;background:var(--ink);border-radius:4px;margin:0 auto;opacity:.35}
.drawer h4{margin:0;font-size:19px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:2px solid var(--ink);background:var(--card);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex:none}
.x .ic{width:16px;height:16px}
.display{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob);padding:6px 14px}
.display .amt{font-size:46px;line-height:1}
.display .after{font-size:13px;color:var(--ink-soft)}
.hintline{font-size:13px;background:var(--a1-soft);border:2px dashed var(--ink);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{font-family:var(--num);font-size:27px;font-weight:700;background:var(--card);border:2.5px solid var(--ink);border-radius:var(--wob);box-shadow:2px 3px 0 var(--ink);padding:5px 0;display:grid;place-items:center}
.key:nth-child(odd){border-radius:var(--wob2)}
.key:active{transform:translate(1px,2px);box-shadow:none}
.key.go{grid-row:span 3;background:var(--a1);font-family:var(--hand);font-size:19px;gap:2px}
.key.go:disabled{opacity:.45}
.key .ic{width:24px;height:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pickbags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pickbags button{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:var(--wob2);padding:6px 8px;background:var(--card);text-align:left;font-size:14px}
.pickbags button[aria-pressed="true"]{background:var(--a2-soft);box-shadow:2px 2px 0 var(--ink)}
.iconpick{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.iconpick button{aspect-ratio:1;max-width:100%;border:2px solid transparent;border-radius:10px;display:grid;place-items:center}
.iconpick button[aria-pressed="true"]{border-color:var(--ink);background:var(--a2-soft)}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatches button{width:30px;height:30px;border:2px solid var(--ink);border-radius:50% 45% 55% 48%}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.erow{border:2px dashed var(--ink);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) rotate(-1deg);background:var(--a2);border:2.5px solid var(--ink);border-radius:var(--wob2);box-shadow:3px 3px 0 var(--ink);padding:7px 14px;z-index:20;font-size:15px;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:2px solid var(--ink);border-radius:8px;background:var(--card);padding:1px 8px;font-size:13px}
.sync{font-size:12px;color:var(--ink-soft);text-align:center}
.rough{filter:url(#rough)}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}.bag{transition:none}}
</style>


</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<main class="wrap" id="app"></main>
<div class="dock"><nav id="dock" aria-label="切換頁面"></nav></div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<script>
const THEME = "dog";
const ARTIFACT_URL = "https://claude.ai/artifact/7N8jkUKZbH6YRV6vfGD5tg";
const MODE = "app"; // "artifact" 或 "app"
const TH = {

/* ---------------- utilities ---------------- */
const pad = n => String(n).padStart(2,"0");
const NOW = new Date();
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const MONTH = ymOf(NOW);
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const fmt = n => Math.round(n||0).toLocaleString("zh-TW");
const fmt2 = n => (Math.round((n||0)*100)/100).toLocaleString("zh-TW",{maximumFractionDigits:2});
const sgn = n => (n>0?"+":n<0?"−":"")+fmt(Math.abs(n));
const pct = n => (n>0?"+":"")+(Math.round(n*100)/100).toFixed(2)+"%";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const n0 = s => parseFloat(String(s??"").replace(/[^\d.\-]/g,""))||0;
const addMonths = (ym,k) => { const [y,m]=ym.split("-").map(Number); const d=new Date(y,m-1+k,1); return ymOf(d); };
const daysIn = ym => { const [y,m]=ym.split("-").map(Number); return new Date(y,m,0).getDate(); };
const color = i => TH.chart[((i%TH.chart.length)+TH.chart.length)%TH.chart.length];

const canonMerchant = m => { if(!m) return ""; const s=m.toLowerCase(); const hit=MLIST.find(x=>s.includes(x.n.toLowerCase())); return hit?hit.n:m.trim(); };

let S = sampleState();
const UI = { tab:"home", month:MONTH, year:NOW.getFullYear(), showFall:false, bagFilter:null,
 };
try{ const t=localStorage.getItem("ledger-tab-"+THEME); if(t) UI.tab=t; }catch(e){}

const LSK = "ledger-v2-"+THEME;
let remote = null, syncNote = MODE==="app" ? "資料存在這支手機裡，記得定期到「資產」頁備份" : "資料存在這台裝置的瀏覽器裡", lastSaved = {}, saveChain = Promise.resolve();
function splitDocs(s){
  const {txns,...core} = s; const docs = {core:JSON.stringify(core)};
  for(const t of txns){ const k="m-"+t.date.slice(0,7); (docs[k] ||= []).push(t); }
  for(const k in docs) if(k!=="core") docs[k]=JSON.stringify(docs[k]);
  for(const k in lastSaved) if(!(k in docs)) docs[k]="[]";
  return docs;
}
function persist(){
  // keep this month's savings snapshot current (only on real user changes)
  S.savingsLog[MONTH] = savingsNow();
  try{ localStorage.setItem(LSK, JSON.stringify(S)); }catch(e){}
  if(!remote) return;
  clearTimeout(persist.t);
  persist.t = setTimeout(()=>{
    const docs = splitDocs(S);
    const dirty = Object.keys(docs).filter(k=>docs[k]!==lastSaved[k]);
    saveChain = saveChain.then(async()=>{
      for(const k of dirty){ await remote.doc(k).set({body:docs[k],at:Date.now()}); lastSaved[k]=docs[k]; }
      if(syncNote.includes("失敗")){ syncNote="雲端同步好了，只有你看得到"; paintSync(); }
    }).catch(()=>{ syncNote="雲端同步失敗，先存在這台裝置，下次操作會再試"; paintSync(); });
  },600);
}
function migrate(s){ if(!s||s.v!==2) return null; s.fixed ||= defaultFixed(); s.bags.forEach((b,i)=>{ b.color ||= SWATCHES[(i*3)%SWATCHES.length]; if(!Array.isArray(b.items)) b.items = DEFAULT_ITEMS[b.id] ? [...DEFAULT_ITEMS[b.id]] : []; }); s.cards.forEach((c,i)=>{ c.closeDay ||= 5; c.payDay ||= 20; c.limit ||= 0; c.color ||= SWATCHES[(i*4+7)%SWATCHES.length]; delete c.rules; delete c.base; delete c.style; }); delete s.inbox; delete s.seen; s.portLog ||= {}; s.savingsLog ||= {}; return s; }
async function boot(){
  try{ const c=migrate(JSON.parse(localStorage.getItem(LSK)||"null")); if(c) S=c; }catch(e){}
  render();
  try{
    if(MODE==="app"){ try{ navigator.storage?.persist?.(); }catch(_){} throw 0; }
    if(typeof claude==="undefined") throw 0;
    const [db,user] = await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) throw 0;
    const me = await user.id(); if(!me) throw 0;
    const col = db.collection(`data/users/${me}`);
    const snap = await col.get();
    remote = { doc:k=>col.doc(k) };
    const map = {}; snap.docs.forEach(d=>{ const b=d.data(); if(b&&typeof b.body==="string") map[d.id]=b.body; });
    if(map.core){
      const core = JSON.parse(map.core); const txns=[];
      for(const k in map){ if(k.startsWith("m-")) txns.push(...JSON.parse(map[k])); }
      const s = migrate({...core, txns});
      if(s){ S=s; lastSaved={...map}; try{ localStorage.setItem(LSK, JSON.stringify(S)); }catch(e){} }
    } else { persist(); }

/* ---------------- derived numbers ---------------- */
const monthTx = ym => S.txns.filter(t=>t.date.startsWith(ym));
function spentBy(ym){ const m={}; for(const t of monthTx(ym)) m[t.bag]=(m[t.bag]||0)+t.amt; return m; }
function fixedBag(id){ if(!String(id).startsWith("fx:")) return null; const f=S.fixed.find(x=>"fx:"+x.id===id); return f?{id,icon:f.icon,name:f.name,budget:f.amount,color:f.color,channel:"一般"}:{id,icon:"coin",name:"固定支出",budget:0,color:FIXED_COLOR}; }
const bagOf = id => S.bags.find(b=>b.id===id) || fixedBag(id) || {id, icon:"bag", name:"已刪除的袋子", budget:0};
const bagColor = id => { const b=bagOf(id); return b.color || color(bagIndex(id)); };
const fixedPaid = (f,ym=MONTH) => S.txns.some(t=>t.fixedId===f.id && t.date.startsWith(ym));
const fixedPending = () => S.fixed.filter(f=>!fixedPaid(f)).reduce((s,f)=>s+f.amount,0);
function fixedTx(f,date){ return {id:uid(),bag:"fx:"+f.id,fixedId:f.id,amt:f.amount,merchant:f.name,pay:f.pay,wallet:"",foreign:false,channel:null,date,ts:new Date(date+"T09:00").getTime(),src:"fixed"}; }
function autoFixed(){
  let n=0;
  for(const f of S.fixed){
    if(!f.auto || f.day>NOW.getDate() || fixedPaid(f)) continue;
    const tx=fixedTx(f,`${MONTH}-${pad(Math.min(f.day,daysIn(MONTH)))}`); S.txns.push(tx);
    if(tx.pay?.startsWith("acc:")){ const a=S.accounts.find(a=>a.id===tx.pay.slice(4)); if(a) a.balance-=tx.amt; }
    n++;
  }
  if(n){ persist(); toast(`${TH.hi}！本月 ${n} 筆固定支出已自動記下`); }
}
const bagIndex = id => Math.max(0,S.bags.findIndex(b=>b.id===id));
const accTotal = () => S.accounts.reduce((s,a)=>s+a.balance,0);
const goalSaved = () => S.goals.items.reduce((s,g)=>s+g.saved,0);
const cardById = id => S.cards.find(c=>c.id===id);
const cardDue = c => S.txns.filter(t=>t.pay==="card:"+c.id && t.ts>c.paidTs).reduce((s,t)=>s+t.amt,0);
const allCardDue = () => S.cards.reduce((s,c)=>s+cardDue(c),0);
const savingsNow = () => accTotal();   // 卡費待繳不扣，只看帳戶餘額
function canSpend(){ const sp=spentBy(MONTH); return S.bags.reduce((s,b)=>s+Math.max(0,b.budget-(sp[b.id]||0)),0); }
function waterfall(){
  const acc=accTotal(), due=allCardDue(), gs=goalSaved(), cs=canSpend();
  const fp = fixedPending();
  const un = acc - due - fp - gs - S.reserves.save - S.reserves.buffer - cs;
  return {total:acc, rows:[["卡費待繳",due,"var(--danger)"],["固定支出（本月還沒扣）",fp,FIXED_COLOR],["目標專款",gs,color(4)],["指定儲蓄",S.reserves.save,color(2)],["安全緩衝",S.reserves.buffer,color(5)],["還沒分配",Math.max(0,un),"var(--ink-soft)"]], cs, un};
}
const payLabel = p => { if(!p) return "現金"; const [k,id]=p.split(":"); if(k==="card"){ const c=cardById(id); return c?c.name:"已刪除的卡"; } const a=S.accounts.find(a=>a.id===id); return a?a.name:"帳戶"; };
const txChannel = t => t.channel || channelOfMerchant(t.merchant) || bagOf(t.bag).channel || "一般";

/* ---------------- card billing cycle ---------------- */
const dayIn = (y,m,d) => new Date(y, m, Math.min(d, new Date(y, m+1, 0).getDate()));
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const md = d => `${d.getMonth()+1}/${d.getDate()}`;
function cardCycle(c, ref=new Date()){
  let end = dayIn(ref.getFullYear(), ref.getMonth(), c.closeDay);
  if(ref.getDate() > end.getDate()) end = dayIn(ref.getFullYear(), ref.getMonth()+1, c.closeDay);
  const prevEnd = dayIn(end.getFullYear(), end.getMonth()-1, c.closeDay);
  const prevPrevEnd = dayIn(end.getFullYear(), end.getMonth()-2, c.closeDay);
  const plus1 = d => { const x=new Date(d); x.setDate(x.getDate()+1); return x; };
  const payOf = e => dayIn(e.getFullYear(), e.getMonth() + (c.payDay>c.closeDay?0:1), c.payDay);
  const sum = (a,b) => S.txns.filter(t=>t.pay==="card:"+c.id && t.date>=ds(a) && t.date<=ds(b)).reduce((s,t)=>s+t.amt,0);
  const curStart = plus1(prevEnd), prevStart = plus1(prevPrevEnd);
  return { curStart, curEnd:end, curSpend:sum(curStart,end), prevStart, prevEnd, prevBill:sum(prevStart,prevEnd), payDate:payOf(prevEnd), nextPay:payOf(end) };
}

/* ---------------- charts ---------------- */
function donut(slices,total,label="已花"){
  const R=56,C=2*Math.PI*R; let off=0;
  const arcs = total>0 ? slices.map(x=>{ const len=x.v/total*C; const s=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="${x.c}" stroke-width="26" stroke-dasharray="${Math.max(0,len-2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`; off+=len; return s; }).join("") : "";
  return `<svg class="donut" viewBox="0 0 150 150" role="img" aria-label="各預算袋花費比例">
    <circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--grid)" stroke-width="26"/>${arcs}
    <g filter="url(#rough)" fill="none" stroke="var(--ink)" stroke-width="2.5"><path d="M75 6C114 5 146 36 144 76 143 114 112 145 74 144 35 143 5 113 6 74 7 36 37 7 75 6Z"/><path d="M75 45C92 44 106 58 105 76 104 93 91 106 74 105 57 104 45 91 45 74 46 58 58 46 75 45Z" fill="var(--card)"/></g>
    <text x="75" y="71" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="var(--hand)">${label}</text>
    <text x="75" y="91" text-anchor="middle" font-size="21" font-weight="700" fill="var(--ink)" font-family="var(--num)">${fmt(total)}</text></svg>`;
}
function paceChart(ym){
  const W=320,H=150,L=8,R=8,T=16,B=22, days=daysIn(ym), last=addMonths(ym,-1), ldays=daysIn(last);
  const dailyOf = (m,n) => { const a=Array(n).fill(0); monthTx(m).forEach(t=>{ a[+t.date.slice(8)-1]+=t.amt; }); return a; };
  const cur = dailyOf(ym,days), prev = dailyOf(last,ldays);
  const upto = ym===MONTH ? NOW.getDate() : days;
  const cum = a => a.reduce((acc,v,i)=>(acc.push((acc[i-1]||0)+v),acc),[]);
  const cc = cum(cur).slice(0,upto), pc = cum(prev);
  const max = Math.max(1, ...cc, ...pc) * 1.1, dmax = Math.max(1,...cur.slice(0,upto))*1.0;
  const x = d => L + (d-0.5)/days*(W-L-R), y = v => H-B - v/max*(H-T-B);
  const line = arr => arr.map((v,i)=>`${i?"L":"M"}${x(i+1).toFixed(1)} ${y(v).toFixed(1)}`).join("");
  const bars = cur.slice(0,upto).map((v,i)=> v? `<rect x="${(x(i+1)-2.5).toFixed(1)}" y="${(H-B - v/dmax*22).toFixed(1)}" width="5" height="${(v/dmax*22).toFixed(1)}" rx="1.5" fill="var(--a3)"/>`:"").join("");
  const endV = cc[cc.length-1]||0, prevSame = pc[Math.min(upto,ldays)-1]||0;
  const ticks = [1,Math.ceil(days/2),days].map(d=>`<text x="${x(d)}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--ink-soft)" font-family="var(--num)">${+ym.slice(5)}/${d}</text>`).join("");
  const area = cc.length ? `${line(cc)}L${x(cc.length).toFixed(1)} ${H-B}L${x(1).toFixed(1)} ${H-B}Z` : "";
  return {svg:`<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="本月累計花費和上月比較">
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--ink)" stroke-width="2" filter="url(#rough)"/>
    <line x1="${L}" x2="${W-R}" y1="${y(max/1.1/2)}" y2="${y(max/1.1/2)}" stroke="var(--grid)" stroke-width="1.5" stroke-dasharray="3 4"/>
    ${bars}
    <path d="${line(pc)}" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="5 5"/>
    ${area?`<path d="${area}" fill="var(--a1)" opacity=".35"/>`:""}
    ${cc.length?`<path d="${line(cc)}" fill="none" stroke="var(--ink)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#rough)"/>`:""}
    ${cc.length?`<circle cx="${x(cc.length)}" cy="${y(endV)}" r="4.5" fill="var(--a2)" stroke="var(--ink)" stroke-width="2"/>`:""}
    ${ticks}</svg>`, endV, prevSame, today: cur[upto-1]||0, upto};
}
function yearInfo(Y){
  const log=S.savingsLog, cur = y=>m=> (Y===NOW.getFullYear() && m===NOW.getMonth()+1) ? savingsNow() : log[`${y}-${pad(m)}`];
  const vals = Array.from({length:12},(_,i)=>cur(Y)(i+1));
  const base = log[`${Y-1}-12`] ?? vals.find(v=>v!=null) ?? 0;
  const lastIdx = vals.reduce((a,v,i)=>v!=null?i:a,-1);
  const latest = lastIdx>=0 ? vals[lastIdx] : base;
  return {vals, base, latest, lastIdx, saved: latest-base, target: +S.goals.targets[Y]||0};
}
function yearChart(Y){
  const {vals,base,target} = yearInfo(Y);
  const W=320,H=180,L=34,R=8,T=14,B=24;
  const pts = vals.filter(v=>v!=null);
  const hi = Math.max(base+target, ...pts, base)*1.05, lo = Math.min(base, ...pts)*0.9;
  const bw=(W-L-R)/12, x=i=>L+bw*i+bw/2, y=v=>H-B-(v-lo)/(hi-lo||1)*(H-T-B);
  const bars = vals.map((v,i)=> v==null?"" : `<rect x="${(x(i)-bw*0.32).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${(H-B-y(v)).toFixed(1)}" rx="3" fill="${(i>0&&vals[i-1]!=null&&v<vals[i-1])?"var(--a3)":"var(--a1)"}" stroke="var(--ink)" stroke-width="1.8"/>`).join("");
  const tpath = `M${x(0)-bw/2} ${y(base)}L${x(11)+bw/2} ${y(base+target)}`;
  const gl = [lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1.2"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end" font-size="9" fill="var(--ink-soft)" font-family="var(--num)">${v>=10000?Math.round(v/1000)+"k":fmt(v)}</text>`).join("");
  const mt = vals.map((_,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink-soft)" font-family="var(--num)">${i+1}</text>`).join("");
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Y} 年每月存款與目標線">${gl}
    <line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--ink)" stroke-width="2" filter="url(#rough)"/>
    <g filter="url(#rough)">${bars}</g>
    ${target?`<path d="${tpath}" stroke="var(--danger)" stroke-width="2.2" stroke-dasharray="6 5" fill="none"/><text x="${W-R}" y="${y(base+target)-5}" text-anchor="end" font-size="10" fill="var(--danger)" font-family="var(--hand)">目標線</text>`:""}
    ${mt}</svg>`;
}

function exportBackup(){
  const data = JSON.stringify({app:"cute-ledger",theme:THEME,at:new Date().toISOString(),state:S});
  const name = `${TH.name}-備份-${todayStr()}.json`;
  const file = new File([data], name, {type:"application/json"});
  const done = () => { S.lastBackup = Date.now(); persist(); render(); toast("備份好了，存到 iCloud 雲碟最安全"); };
  if(navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:name}).then(done).catch(()=>{});
  } else {
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); done();
  }
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let obj; try{ obj = JSON.parse(r.result); }catch(e){ toast("這個檔案不是備份檔"); return; }
    const st = migrate(obj && obj.state);
    if(!st){ toast("這個檔案不是記帳本的備份"); return; }
    openDrawer(`${head("用備份蓋掉現在的資料？")}<div>備份日期：${esc((obj.at||"").slice(0,10))}，共 ${st.txns.length} 筆紀錄。現在手機裡的資料會被取代。</div>
      <div class="grid2"><button type="button" class="btn ghost" data-close>先不要</button><button type="button" class="btn warn" id="doImport">還原</button></div>`, d=>{
      d.querySelector("#doImport").onclick=()=>{ S=st; persist(); closeDrawer(); render(); toast("還原好了"); };
    });
  };
  r.readAsText(file);
}

    <div class="months" style="margin-top:8px">${info.vals.map((v,i)=>{ const pv = i? info.vals[i-1] : info.base; const d = v!=null && pv!=null ? v-pv : null; const isNow = Y===NOW.getFullYear()&&i===NOW.getMonth();

  </section>

  <section class="sheet">${S.goals.items.length?S.goals.items.map((g,i)=>{ const p=g.target?Math.min(100,g.saved/g.target*100):0; return `<div class="gi">

    <div class="label" style="margin-top:6px">存進專款的錢會從「能花的」裡扣掉，不會被不小心花掉。</div></section>

const layer = document.getElementById("layer");
function openDrawer(html,mount){
  layer.innerHTML = `<div class="scrim" data-close></div><div class="drawer" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div>`;
  mount && mount(layer.querySelector(".drawer"));
}
function closeDrawer(){ layer.innerHTML=""; }
layer.addEventListener("click",e=>{ if(e.target.closest("[data-close]")) closeDrawer(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && layer.innerHTML) closeDrawer(); });
const head = t => `<h4>${t}<button type="button" class="x" data-close aria-label="關閉">${ic("close")}</button></h4>`;
function toast(msg,undo){
  const t=document.getElementById("toast"); t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button type="button" id="undoBtn">復原</button>`:""}`; t.hidden=false;
  if(undo) document.getElementById("undoBtn").onclick=()=>{ undo(); t.hidden=true; };
  clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true, undo?4500:2000);
}
function recordTx(tx){
  S.txns.push(tx);
  if(tx.pay?.startsWith("acc:")){ const a=S.accounts.find(a=>a.id===tx.pay.slice(4)); if(a) a.balance-=tx.amt; }
  persist(); render();
  toast(`記下${tx.date!==todayStr()?" "+(+tx.date.slice(5,7))+"/"+(+tx.date.slice(8)):""} ${bagOf(tx.bag).name} NT$${fmt(tx.amt)}`, ()=>{ removeTx(tx.id); });
}
function removeTx(id){
  const t=S.txns.find(x=>x.id===id); if(!t) return;
  S.txns=S.txns.filter(x=>x.id!==id);
  if(t.pay?.startsWith("acc:")){ const a=S.accounts.find(a=>a.id===t.pay.slice(4)); if(a) a.balance+=t.amt; }
  persist(); render();
}

function openEntry(pre={}){
  if(!S.bags.length){ toast("先新增一個預算袋"); return; }
  const E = {bag:pre.bag||S.bags[0].id, amt:pre.amt?String(pre.amt):"", pay:pre.pay||("acc:"+((S.accounts.find(a=>a.id==="cash")||S.accounts[0])?.id)), wallet:pre.wallet||"實體卡", foreign:!!pre.foreign, merchant:pre.merchant||""};
  E.date = pre.date || (UI.tab==="detail" && UI.month<MONTH ? `${UI.month}-${pad(daysIn(UI.month))}` : todayStr());
  const dayAgo = n => { const d=new Date(); d.setDate(d.getDate()-n); return ds(d); };
  const pays = [...S.accounts.map(a=>["acc:"+a.id,a.name]), ...S.cards.map(c=>["card:"+c.id,c.name])];
  openDrawer(`
    <h4><span class="row" id="eTitle"></span><button type="button" class="x" data-close aria-label="關閉">${ic("close")}</button></h4>
    <div class="chips scroll" id="eBags">${S.bags.map((b,i)=>`<button type="button" class="chip" data-pick="${b.id}"><span style="color:var(--ink)">${ic(b.icon)}</span>${esc(b.name)}</button>`).join("")}</div>
    <div class="display"><div class="after" id="eAfter"></div><div class="amt num" id="eAmt">0</div></div>
    <div class="chips scroll" id="eDates"><button type="button" class="chip" data-day="0">今天</button><button type="button" class="chip" data-day="1">昨天</button><label class="chip" style="cursor:pointer">${ic("list")}<input type="date" id="eDate" max="${todayStr()}" value="${E.date}" style="border:none;background:none;font:inherit;color:inherit;padding:0" aria-label="選日期"></label></div>
    <div class="chips scroll">${pays.map(([k,l])=>`<button type="button" class="chip" data-pay="${k}">${k.startsWith("card")?ic("card"):ic("wallet")}${esc(l)}</button>`).join("")}</div>
    <div class="chips scroll" id="eMer"></div>
    <input class="inp" id="eNote" maxlength="30" placeholder="細項或備註（選填）" value="${esc(E.merchant)}">
    <div class="keys">${["7","8","9","⌫","4","5","6","GO","1","2","3",".","0","00"].map(k=>k==="GO"?`<button type="button" class="key go" id="eGo" disabled>${ic("check")}記下</button>`:k==="⌫"?`<button type="button" class="key" data-k="⌫" aria-label="刪一個字">${ic("back")}</button>`:`<button type="button" class="key" data-k="${k}">${k}</button>`).join("")}</div>`, d=>{
    const $=s=>d.querySelector(s);
    const upd=()=>{
      const b=bagOf(E.bag), v=n0(E.amt), eym=E.date.slice(0,7), left=b.budget-(spentBy(eym)[E.bag]||0);
      $("#eTitle").innerHTML=`<span class="tile" style="background:${bagColor(E.bag)};width:30px;height:30px">${ic(b.icon)}</span>記在 ${esc(b.name)}`;
      d.querySelectorAll("[data-pick]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.pick===E.bag));
      d.querySelectorAll("[data-pay]").forEach(c=>c.setAttribute("aria-pressed",c.dataset.pay===E.pay));
      $("#eAmt").textContent = E.amt||"0";
      d.querySelectorAll("[data-day]").forEach(c=>c.setAttribute("aria-pressed",E.date===dayAgo(+c.dataset.day)));
      const dl=d.querySelector("#eDate").closest(".chip"); dl.setAttribute("aria-pressed", E.date!==dayAgo(0)&&E.date!==dayAgo(1));
      $("#eAfter").innerHTML = `${+eym.slice(5)} 月剩 <span class="num">${fmt(left)}</span> → <span class="num" style="color:${left-v<0?"var(--danger)":"var(--ink)"}">${fmt(left-v)}</span>`;
      $("#eGo").disabled = !(v>0);
      const items = b.items || [];
      const recent = [...new Set(S.txns.filter(t=>t.bag===E.bag&&t.merchant&&!items.includes(t.merchant)).sort((a,b)=>b.ts-a.ts).map(t=>t.merchant))].slice(0,3);
      $("#eMer").innerHTML = [...items,...recent].map(m=>`<button type="button" class="chip" data-mer="${esc(m)}" aria-pressed="${$("#eNote").value===m}">${esc(m)}</button>`).join("");
    };
    d.addEventListener("click",e=>{
      const t=e.target.closest("button"); if(!t) return;
      if(t.dataset.day!=null){ E.date=dayAgo(+t.dataset.day); d.querySelector("#eDate").value=E.date; }
      else if(t.dataset.pick) E.bag=t.dataset.pick;
      else if(t.dataset.pay) E.pay=t.dataset.pay;
      else if(t.dataset.mer) $("#eNote").value=t.dataset.mer;
      else if(t.dataset.k){ const k=t.dataset.k;
        if(k==="⌫") E.amt=E.amt.slice(0,-1);
        else if(k==="."){ if(!E.amt.includes(".")) E.amt=(E.amt||"0")+"."; }
        else if(E.amt.replace(".","").length<8) E.amt=(E.amt==="0"?"":E.amt)+k;
      }
      else if(t.id==="eGo"){
        const v=n0(E.amt); if(!(v>0)) return;
        const note=$("#eNote").value.trim();
        closeDrawer();
        recordTx({id:uid(),bag:E.bag,amt:v,merchant:note,pay:E.pay,wallet:"",foreign:false,channel:null,date:E.date,ts:E.date===todayStr()?Date.now():new Date(E.date+"T12:00").getTime(),src:pre.src||"manual"});
        if(pre.onDone) pre.onDone();
        return;
      } else return;
      upd();
    });
    d.addEventListener("input",e=>{ if(e.target.id==="eNote") upd(); });
    d.addEventListener("change",e=>{ if(e.target.id==="eDate" && e.target.value){ E.date = e.target.value>todayStr()?todayStr():e.target.value; e.target.value=E.date; upd(); } });
    upd();
  });
}

      ${sel===i?`<div class="label">顏色</div>${swatches(b.color)}<div class="label">圖示</div><div class="iconpick">${BAG_ICONS.map(n=>`<button type="button" data-icon="${n}" aria-pressed="${b.icon===n}" aria-label="${n}">${ic(n)}</button>`).join("")}</div>

    </div>`).join("");
  };
  openDrawer(`${head("調整預算袋")}<div class="label">每袋一個月想花多少？點左邊的圓圈可以換顏色、圖示和記帳時的快速細項。</div>
    <div id="bRows" style="display:flex;flex-direction:column;gap:8px"></div>

    paint(d);
    d.addEventListener("input",e=>{ const r=e.target.closest("[data-i]"); if(!r) return; const b=draft[+r.dataset.i]; const f=e.target.dataset.f; if(f==="budget") b.budget=parseInt(e.target.value.replace(/\D/g,""))||0; else if(f==="items") b.items=splitItems(e.target.value); else if(f) b.name=e.target.value; });
    d.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return; const r=b.closest("[data-i]"); const i=r?+r.dataset.i:-1;
      if(b.dataset.sel!=null){ sel = sel===+b.dataset.sel?-1:+b.dataset.sel; paint(d); }
      else if(b.dataset.icon){ draft[i].icon=b.dataset.icon; paint(d); }
      else if(b.dataset.ch){ draft[i].channel=b.dataset.ch; paint(d); }
      else if(b.dataset.color){ draft[i].color=b.dataset.color; paint(d); }
      else if(b.dataset.rm!=null){ draft.splice(+b.dataset.rm,1); sel=-1; paint(d); }
      else if(b.id==="bAdd"){ draft.push({id:uid(),icon:"gift",name:"新袋子",budget:1000,channel:"一般",items:[],color:SWATCHES[(draft.length*5)%SWATCHES.length]}); sel=draft.length-1; paint(d); }
      else if(b.id==="bSave"){ S.bags=draft.filter(b=>b.name.trim()).map(b=>({...b,name:b.name.trim()})); persist(); closeDrawer(); render(); toast("預算袋更新好了"); }
    });
  });
}

function openFixed(){
  const draft = S.fixed.map(f=>({...f}));
  let sel = -1;
  const pays = [...S.accounts.map(a=>["acc:"+a.id,a.name]), ...S.cards.map(c=>["card:"+c.id,c.name])];
  const paint = d => {
    d.querySelector("#fRows").innerHTML = draft.map((f,i)=>`<div class="erow" data-i="${i}">
      <div class="row"><button type="button" class="tile" data-sel="${i}" style="background:${f.color}" aria-label="換圖示和顏色">${ic(f.icon)}</button>
        <input class="inp grow" value="${esc(f.name)}" maxlength="10" data-f="name" aria-label="名稱">
        <button type="button" class="x" data-rm="${i}" aria-label="刪除">${ic("trash")}</button></div>
      <div class="grid2"><label class="field">每月金額<input class="inp num" inputmode="numeric" value="${f.amount}" data-f="amount"></label><label class="field">每月幾號扣<input class="inp num" inputmode="numeric" value="${f.day}" data-f="day"></label></div>
      <div class="field">從哪裡扣<div class="chips">${pays.map(([k,l])=>`<button type="button" class="chip" data-pay="${k}" aria-pressed="${f.pay===k}">${esc(l)}</button>`).join("")}</div></div>
      <div class="chips"><button type="button" class="chip" data-auto aria-pressed="${!!f.auto}">${ic("check")} 到了那天自動記一筆</button></div>
      ${sel===i?`<div class="label">顏色</div>${swatches(f.color)}<div class="label">圖示</div><div class="iconpick">${BAG_ICONS.map(n=>`<button type="button" data-icon="${n}" aria-pressed="${f.icon===n}" aria-label="${n}">${ic(n)}</button>`).join("")}</div>`:""}
    </div>`).join("");
  };
  openDrawer(`${head("每月固定支出")}<div class="label">瑜伽、電信、保險、定期定額這類每月一定要付的錢。本月還沒扣的會先從能花的錢扣掉。</div>
    <div id="fRows" style="display:flex;flex-direction:column;gap:8px"></div>
    <button type="button" class="btn ghost" id="fAdd">${ic("plus")} 加一項</button><button type="button" class="btn" id="fSave">存好</button>`, d=>{
    paint(d);
    d.addEventListener("input",e=>{ const r=e.target.closest("[data-i]"); if(!r) return; const f=draft[+r.dataset.i], k=e.target.dataset.f; if(k==="name") f.name=e.target.value; else if(k==="amount") f.amount=n0(e.target.value); else if(k==="day") f.day=Math.min(31,Math.max(1,parseInt(e.target.value)||1)); });
    d.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return; const r=b.closest("[data-i]"); const i=r?+r.dataset.i:-1;
      if(b.dataset.sel!=null){ sel = sel===+b.dataset.sel?-1:+b.dataset.sel; paint(d); }
      else if(b.dataset.icon){ draft[i].icon=b.dataset.icon; paint(d); }
      else if(b.dataset.color){ draft[i].color=b.dataset.color; paint(d); }
      else if(b.dataset.pay){ draft[i].pay=b.dataset.pay; paint(d); }
      else if("auto" in b.dataset){ draft[i].auto=!draft[i].auto; paint(d); }
      else if(b.dataset.rm!=null){ draft.splice(+b.dataset.rm,1); sel=-1; paint(d); }
      else if(b.id==="fAdd"){ draft.push({id:uid(),icon:"coin",name:"新的固定支出",amount:500,day:1,pay:pays[0]?.[0]||"",color:SWATCHES[(draft.length*5)%SWATCHES.length],auto:true}); sel=draft.length-1; paint(d); }
      else if(b.id==="fSave"){ S.fixed=draft.filter(f=>f.name.trim()).map(f=>({...f,name:f.name.trim()})); persist(); closeDrawer(); render(); toast("固定支出存好了"); }
    });
  });
}
function openCardEdit(id){
  const src = id ? cardById(id) : {id:uid(),name:"",last4:"",limit:0,closeDay:5,payDay:20,paidTs:Date.now(),color:SWATCHES[(S.cards.length*4+7)%SWATCHES.length]};
  const c = JSON.parse(JSON.stringify(src));
  openDrawer(`${head(id?"編輯卡片":"新增卡片")}
    <div class="grid2"><label class="field">卡片名稱<input class="inp" id="cName" value="${esc(c.name)}" placeholder="例如：國泰 CUBE"></label><label class="field">末四碼<input class="inp num" id="cLast" maxlength="4" inputmode="numeric" value="${esc(c.last4)}"></label></div>
    <label class="field">信用額度<input class="inp num" id="cLimit" inputmode="numeric" value="${c.limit||""}" placeholder="例如 80000"></label>
    <div class="grid2"><label class="field">每月幾號結帳<input class="inp num" id="cClose" inputmode="numeric" value="${c.closeDay}"></label><label class="field">每月幾號繳款<input class="inp num" id="cPay" inputmode="numeric" value="${c.payDay}"></label></div>
    <div class="label">卡片顏色</div><div id="cColors">${swatches(c.color)}</div>
    <div class="grid2">${id?`<button type="button" class="btn warn" id="cDel">${ic("trash")} 刪除卡片</button>`:"<span></span>"}<button type="button" class="btn" id="cSave">存好</button></div>`, d=>{
    d.addEventListener("click",e=>{
      const b=e.target.closest("button"); if(!b) return;
      const day = v => Math.min(31, Math.max(1, parseInt(v)||1));
      if(b.dataset.color){ c.color=b.dataset.color; d.querySelector("#cColors").innerHTML=swatches(c.color); }
      else if(b.id==="cDel"){ S.cards=S.cards.filter(x=>x.id!==c.id); persist(); closeDrawer(); render(); toast("卡片刪掉了，之前的紀錄會保留"); }
      else if(b.id==="cSave"){
        c.name=d.querySelector("#cName").value.trim(); c.last4=d.querySelector("#cLast").value.replace(/\D/g,"").slice(0,4);
        c.limit=n0(d.querySelector("#cLimit").value); c.closeDay=day(d.querySelector("#cClose").value); c.payDay=day(d.querySelector("#cPay").value);
        if(!c.name){ toast("幫這張卡取個名字"); return; }
        const i=S.cards.findIndex(x=>x.id===c.id); if(i>=0) S.cards[i]=c; else S.cards.push(c);
        persist(); closeDrawer(); render(); toast("卡片存好了");
      }
    });
  });
}

function simpleForm(title,fields,onSave,onDel){
  openDrawer(`${head(title)}${fields.map(f=>f.html||(f.label==null?"":`<label class="field">${f.label}<input class="inp ${f.num?"num":""}" id="sf_${f.k}" ${f.num?'inputmode="decimal"':""} value="${esc(f.v??"")}" placeholder="${esc(f.ph||"")}"></label>`)).join("")}
    <div class="grid2">${onDel?`<button type="button" class="btn warn" id="sfDel">${ic("trash")} 刪除</button>`:"<span></span>"}<button type="button" class="btn" id="sfSave">存好</button></div>`, d=>{
    d.querySelector("#sfSave").onclick=()=>{ const vals={}; fields.forEach(f=>{ if(f.k){ const el=d.querySelector("#sf_"+f.k); vals[f.k]= f.num? n0(el.value) : el.value.trim(); } }); if(onSave(vals,d)!==false){ persist(); closeDrawer(); render(); } };
    if(onDel) d.querySelector("#sfDel").onclick=()=>{ onDel(); persist(); closeDrawer(); render(); };
  });
}
function openAcc(id){
  const a = id ? S.accounts.find(x=>x.id===id) : {id:uid(),name:"",balance:0};
  simpleForm(id?"修改帳戶":"新增帳戶",[{k:"name",label:"名稱",v:a.name,ph:"例如：郵局"},{k:"balance",label:"目前餘額",v:a.balance,num:1}], v=>{
    if(!v.name){ toast("幫帳戶取個名字"); return false; }
    const i=S.accounts.findIndex(x=>x.id===a.id); if(i>=0) S.accounts[i]={...a,...v}; else S.accounts.push({...a,...v});
  }, id && S.accounts.length>1 ? ()=>{ S.accounts=S.accounts.filter(x=>x.id!==id); } : null);
}
function openGoal(id){
  const g = id ? S.goals.items.find(x=>x.id===id) : {id:uid(),icon:"gift",name:"",target:0,saved:0};
  let icon=g.icon;
  simpleForm(id?"編輯目標":"新增目標",[
    {html:`<div class="iconpick" id="gIcons">${BAG_ICONS.map(n=>`<button type="button" data-icon="${n}" aria-pressed="${icon===n}" aria-label="${n}">${ic(n)}</button>`).join("")}</div>`},
    {k:"name",label:"要存錢做什麼",v:g.name,ph:"例如：換新電腦"},
    {html:`<div class="grid2"><label class="field">目標金額<input class="inp num" id="sf_target" inputmode="numeric" value="${g.target||""}"></label><label class="field">已經存了<input class="inp num" id="sf_saved" inputmode="numeric" value="${g.saved||""}"></label></div>`},
    {k:"target",num:1},{k:"saved",num:1},
  ], v=>{ if(!v.name){ toast("寫一下目標名稱"); return false; } const rec={...g,...v,icon}; const i=S.goals.items.findIndex(x=>x.id===g.id); if(i>=0) S.goals.items[i]=rec; else S.goals.items.push(rec); },
  id?()=>{ S.goals.items=S.goals.items.filter(x=>x.id!==id); }:null);
  const box=layer.querySelector("#gIcons"); box.onclick=e=>{ const b=e.target.closest("[data-icon]"); if(!b) return; icon=b.dataset.icon; box.querySelectorAll("[data-icon]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.icon===icon)); };
}

/* ---------------- events ---------------- */
function setTab(t){ UI.tab=t; try{ localStorage.setItem("ledger-tab-"+THEME,t); }catch(e){} render(); window.scrollTo(0,0); }
document.addEventListener("click",e=>{
  if(e.target.closest("#layer")) return;
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  switch(a){
    case "tab": setTab(b.dataset.tab); break;
    case "entry": openEntry({bag:b.dataset.bag}); break;
    case "fall": UI.showFall=!UI.showFall; render(); break;
    case "editBags": openBags(); break;
    case "editFixed": openFixed(); break;
    case "export": exportBackup(); break;
    case "payFixed": { const f=S.fixed.find(x=>x.id===b.dataset.id); if(f) recordTx(fixedTx(f,todayStr())); break; }
    case "delTx": { const t=S.txns.find(x=>x.id===b.dataset.id); if(!t) break; removeTx(t.id); toast("刪掉了", ()=>recordTxSilent(t)); break; }
    case "month": UI.month=addMonths(UI.month,+b.dataset.d); if(UI.month>MONTH) UI.month=MONTH; render(); break;
    case "filter": UI.bagFilter=b.dataset.bag||null; render(); break;
    case "editCard": openCardEdit(b.dataset.card); break;
    case "payCard": { const c=cardById(b.dataset.card), due=cardDue(c), acc=S.accounts[0]; if(acc) acc.balance-=due; const old=c.paidTs; c.paidTs=Date.now(); persist(); render(); toast(`${c.name} 卡費 ${fmt(due)} 繳清了`, ()=>{ c.paidTs=old; if(acc) acc.balance+=due; persist(); render(); }); break; }
    case "editAcc": openAcc(b.dataset.id); break;
    case "editRes": { const k=b.dataset.k; simpleForm(k==="save"?"指定儲蓄":"安全緩衝",[{k:"v",label:"金額",v:S.reserves[k],num:1}],v=>{ S.reserves[k]=v.v; }); break; }
    case "year": UI.year=Math.min(NOW.getFullYear(),UI.year+ +b.dataset.d); render(); break;
    case "yearGo": UI.year=+b.dataset.y; render(); document.getElementById("goals")?.scrollIntoView({behavior:"smooth"}); break;
    case "toGoals": document.getElementById("goals")?.scrollIntoView({behavior:"smooth"}); break;
    case "editTarget": simpleForm(`${UI.year} 年存款目標`,[{k:"v",label:"今年想多存多少",v:S.goals.targets[UI.year]||"",num:1}],v=>{ S.goals.targets[UI.year]=v.v; }); break;
    case "editLog": { const m=b.dataset.m; simpleForm(`${m.replace("-"," 年 ")} 月底存款`,[{k:"v",label:"那個月底的存款",v:S.savingsLog[m]??"",num:1}],v=>{ S.savingsLog[m]=v.v; }, S.savingsLog[m]!=null?()=>{ delete S.savingsLog[m]; }:null); break; }
    case "editGoal": openGoal(b.dataset.id); break;
    case "depGoal": { const g=S.goals.items.find(x=>x.id===b.dataset.id); simpleForm(`存入「${esc(g.name)}」`,[{k:"v",label:"這次存多少",num:1,v:""}],v=>{ g.saved+=v.v; toast(`${g.name} 又前進了 ${fmt(v.v)}`); }); break; }
    case "clearSample": openDrawer(`${head("清空範例資料？")}<div>會刪掉範例的花費、卡片消費、股票和目標，保留預算袋和卡片設定讓你改成自己的。</div><div class="grid2"><button type="button" class="btn ghost" data-close>先不要</button><button type="button" class="btn warn" id="doClear">清空</button></div>`, d=>{ d.querySelector("#doClear").onclick=()=>{ S=blankState(); persist(); closeDrawer(); render(); toast(`乾乾淨淨，開始記帳吧 ${TH.hi}`); }; }); break;
  }
});
document.addEventListener("change",e=>{ if(e.target.id==="importFile" && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value=""; return; } });
function recordTxSilent(t){ S.txns.push(t); if(t.pay?.startsWith("acc:")){ const a=S.accounts.find(a=>a.id===t.pay.slice(4)); if(a) a.balance-=t.amt; } persist(); render(); }

boot();
</script>

<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
